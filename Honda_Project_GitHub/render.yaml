services:
  - type: web
    name: honda-showroom
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ADMIN_SEED_EMAIL
        value: admin@honda-dealership.com
      - key: ADMIN_SEED_PASSWORD
        value: Admin@Honda2026!
      - key: STAFF_SEED_EMAIL
        value: staff@honda-dealership.com
      - key: STAFF_SEED_PASSWORD
        value: Staff@Honda2026!
